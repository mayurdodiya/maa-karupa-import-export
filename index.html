  <body>
    <div id="root"></div>
    <!-- Netlify Forms detects forms at build time from static HTML. The React form is
         client-rendered, so this hidden twin registers the form + its fields. -->
    <form name="quote" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" /><input type="tel" name="phone" />
      <input type="email" name="email" /><input type="text" name="company" />
      <input type="text" name="product" /><textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.jsx"></script>
